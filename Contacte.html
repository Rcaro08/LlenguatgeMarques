    <main>
        <section>
            <h1>Contacta amb nosaltres</h1>
            <p>Tens algun dubte o suggeriment? Escriu-nos i et respondrem aviat.</p>
            <form method="post" action="#">
                <p>
                    <label for="nom">Nom</label><br>
                    <input type="text" id="nom" name="nom" required>
                </p>
                <p>
                    <label for="correu">Correu electrònic</label><br>
                    <input type="email" id="correu" name="correu" required>
                </p>
                <p>
                    <label for="missatge">Missatge</label><br>
                    <textarea id="missatge" name="missatge" rows="5" cols="40" required></textarea>
                </p>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>
